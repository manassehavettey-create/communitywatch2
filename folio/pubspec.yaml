name: folio
description: "Folio — a local-first PDF library and reader."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, navigation, motion
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_animate: ^4.5.2

  # Local storage (encrypted SQLite via SQLite3 Multiple Ciphers, see hooks below)
  drift: ^2.35.0
  sqlite3: ^3.6.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.0
  crypto: ^3.0.7

  # PDF
  pdfrx: ^2.6.5
  pdfium_dart: ^0.3.1
  ffi: ^2.2.0

  # Device integration
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # UI
  intl: ^0.20.2

  # AI (only used when the user adds a key)
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/fonts/OFL-bricolagegrotesque.txt
    - assets/fonts/OFL-manrope.txt
    - assets/fonts/OFL-literata.txt
    - assets/fonts/LICENSE-phosphor.txt
    - assets/images/app_icon/app_icon.png
    - assets/images/onboarding/
    - assets/images/empty/
    - assets/images/collections/
    - assets/images/session/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon/app_icon.png
  adaptive_icon_background: "#A18DEC"
  adaptive_icon_foreground: assets/images/app_icon/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 24

flutter_native_splash:
  color: "#F6F1E7"
  color_dark: "#121110"
  image: assets/images/splash/splash_mark.png
  android_12:
    image: assets/images/splash/splash_mark.png
    color: "#F6F1E7"
    color_dark: "#121110"
  fullscreen: false
