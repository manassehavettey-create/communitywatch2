name: BODYFORGE APK

# Builds an installable Android APK of the BODYFORGE app (bodyforge/) on
# GitHub's servers and attaches it to a pre-release (Releases page) so it can
# be downloaded and side-loaded straight from a phone.
#
# Cloud sync: add two repository secrets (Settings → Secrets and variables →
# Actions): BODYFORGE_SUPABASE_URL and BODYFORGE_SUPABASE_KEY (the public
# publishable/anon key — never the service_role key). Without them the APK is
# built offline-only, which still has every feature except accounts & sync.

on:
  push:
    branches: [claude/bodyforge-fitness-app-sgw8vq]
    paths: ['bodyforge/**', '.github/workflows/bodyforge-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bodyforge-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bodyforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Cloud config (from repository secrets, if set)
        env:
          URL: ${{ secrets.BODYFORGE_SUPABASE_URL }}
          KEY: ${{ secrets.BODYFORGE_SUPABASE_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' "$URL" "$KEY" > env/bodyforge.env.json
            echo "DEFINES=--dart-define-from-file=env/bodyforge.env.json" >> "$GITHUB_ENV"
            echo "APK_KIND=cloud" >> "$GITHUB_ENV"
            echo "Cloud sync: ON"
          else
            echo "APK_KIND=offline" >> "$GITHUB_ENV"
            echo "::warning::Supabase secrets not set, so this APK is offline-only (no accounts/sync)."
          fi

      - name: Tests
        run: flutter test --exclude-tags monkey

      - name: Build universal APK
        run: flutter build apk --release $DEFINES

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi $DEFINES

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/bodyforge.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/bodyforge-arm64.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: bodyforge-apk-${{ env.APK_KIND }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="bodyforge-apk-${GITHUB_SHA::7}"
          if [ "$APK_KIND" = cloud ]; then sync="Cloud sync is ON (accounts + backup)."; else sync="Offline-only build: every feature works on the phone; accounts and cloud sync are off."; fi
          gh release create "$tag" ../dist/bodyforge.apk ../dist/bodyforge-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "BODYFORGE test build (${GITHUB_SHA::7}, $APK_KIND)" \
            --notes "Side-load test build of BODYFORGE. $sync Signed with a debug key, so it's not for Play Store upload. bodyforge.apk works on any Android phone; bodyforge-arm64.apk is smaller and fits most phones from the last ~8 years."
