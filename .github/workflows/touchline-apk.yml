name: Touchline APK

# Builds the Touchline Android APK on GitHub's runners and attaches it to a
# GitHub release. With an API_FOOTBALL_KEY repository secret the APK uses real
# data; without it, a preview APK with clearly-badged demo data is built.
on:
  push:
    branches: [ccr-80592651-w6212i]
    paths:
      - 'football_app/**'
      - '.github/workflows/touchline-apk.yml'
  workflow_dispatch:
    inputs:
      api_key:
        description: 'API-Football key (used only if the API_FOOTBALL_KEY secret is not set)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football_app
    steps:
      - uses: actions/checkout@v4

      # Resolve the key without ever printing it: prefer the repository
      # secret; otherwise read the dispatch input from the event file, mask it,
      # and expose it to later steps.
      - name: Resolve API key
        env:
          SECRET_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          KEY="$SECRET_KEY"
          if [ -z "$KEY" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
            KEY=$(python3 -c "import json,os;print((json.load(open(os.environ['GITHUB_EVENT_PATH'])).get('inputs') or {}).get('api_key') or '')")
          fi
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "API_FOOTBALL_KEY=$KEY" >> "$GITHUB_ENV"
            echo "API key available."
          else
            echo "No API key — a demo-data preview APK will be built."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Check API-Football access (free-plan season coverage)
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then echo "No API_FOOTBALL_KEY secret set — skipping check."; exit 0; fi
          call() { curl -s -H "x-apisports-key: $API_FOOTBALL_KEY" "https://v3.football.api-sports.io/$1"; }
          echo "::group::Account status"; call status | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('response') or {};print('errors:',d.get('errors'));print('plan:',(r.get('subscription') or {}).get('plan'));print('requests today:',r.get('requests'))"; echo "::endgroup::"
          SEASON=$(call "leagues?id=39&current=true" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((s['year'] for l in d.get('response',[]) for s in l.get('seasons',[]) if s.get('current')), ''))")
          echo "Premier League current season: $SEASON"
          echo "::group::Current-season standings"; call "standings?league=39&season=$SEASON" | python3 -c "import json,sys;d=json.load(sys.stdin);e=d.get('errors');rows=(d.get('response') or [{}])[0].get('league',{}).get('standings',[[]])[0] if d.get('response') else [];print('errors:',e);print('RESULT:', 'CURRENT SEASON AVAILABLE' if rows else 'CURRENT SEASON BLOCKED');[print(r['rank'],r['team']['name'],r['points']) for r in rows[:5]]"; echo "::endgroup::"
          echo "::group::Live matches"; call "fixtures?live=all" | python3 -c "import json,sys;d=json.load(sys.stdin);print('errors:',d.get('errors'));print('live matches right now:',d.get('results'))"; echo "::endgroup::"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: |
          if [ -n "$API_FOOTBALL_KEY" ]; then
            flutter build apk --release --dart-define=API_FOOTBALL_KEY="$API_FOOTBALL_KEY"
            echo "MODE=live data" >> "$GITHUB_ENV"
          else
            flutter build apk --release --dart-define=ALLOW_DEMO=true
            echo "MODE=demo data (no API key secret set)" >> "$GITHUB_ENV"
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Touchline-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Touchline-apk
          path: football_app/build/Touchline-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: touchline-build-${{ github.run_number }}
          name: Touchline (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Touchline Android APK — ${{ env.MODE }}.
            Download the .apk below on your phone and open it to install
            (allow "Install unknown apps" for your browser or file manager when asked).
          files: football_app/build/Touchline-${{ github.run_number }}.apk
