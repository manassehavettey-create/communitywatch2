name: Growth Log APK

# Builds the Growth Log Android app and attaches the APKs to a pre-release
# so they can be downloaded and side-loaded for testing.
on:
  workflow_dispatch:
  push:
    branches: [claude/growth-log-app-gs10va]
    paths:
      - 'growth_log/**'
      - '.github/workflows/growth-log-apk.yml'

permissions:
  contents: write

concurrency:
  group: growth-log-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: growth_log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/growth-log.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/growth-log-arm64.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: growth-log-apk
          path: dist/*.apk

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="growth-log-apk-${GITHUB_SHA::7}"
          gh release create "$tag" ../dist/growth-log.apk ../dist/growth-log-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Growth Log test build (${GITHUB_SHA::7})" \
            --notes "Side-load test build of Growth Log. Signed with a debug key — not for Play Store upload. growth-log.apk works on any Android phone; growth-log-arm64.apk is smaller and fits most modern phones."
