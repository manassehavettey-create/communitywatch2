name: Folio APK

# Builds the Folio Android APK on GitHub's runners and attaches it to a
# GitHub release, so it can be downloaded without a local Android setup.
on:
  push:
    branches: [ccr-429a1384-huupok]
    paths:
      - 'folio/**'
      - '.github/workflows/folio-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Folio-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Folio-apk
          path: folio/build/Folio-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: folio-build-${{ github.run_number }}
          name: Folio (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Folio Android APK. Download the .apk below on your phone and open it to install
            (allow "Install unknown apps" for your browser or file manager when asked).
          files: folio/build/Folio-${{ github.run_number }}.apk
