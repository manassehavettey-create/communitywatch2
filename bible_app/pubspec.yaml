name: bible_app
description: "Offline-first Bible reading, study, prayer and journaling app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, navigation, motion
  flutter_riverpod: ^3.4.3
  go_router: any
  flutter_animate: ^4.5.2

  # Local-first storage
  drift: ^2.35.0
  drift_flutter: any
  sqlite3: any
  path_provider: any
  path: any

  # Accounts and sync
  supabase_flutter: ^2.17.2
  google_sign_in: any
  connectivity_plus: ^7.3.1

  # Platform features
  flutter_local_notifications: ^22.3.1
  timezone: any
  flutter_timezone: any
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  share_plus: ^13.3.0

  # Utilities
  phosphor_flutter: ^2.1.0
  intl: any
  uuid: any
  crypto: any
  collection: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  drift_dev: any

flutter:
  uses-material-design: true

  assets:
    - assets/bible/
    - assets/plans/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist.ttf
        - asset: assets/fonts/Urbanist-Italic.ttf
          style: italic
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
